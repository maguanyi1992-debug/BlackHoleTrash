name: Build Android black hole live wallpaper

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - BlackHoleWallpaper_Android_Project.zip
      - .github/workflows/build-android-live-wallpaper.yml

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project package
        shell: bash
        run: |
          set -euo pipefail
          test -f BlackHoleWallpaper_Android_Project.zip
          unzip -t BlackHoleWallpaper_Android_Project.zip

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-build
          mkdir -p android-build
          unzip -q BlackHoleWallpaper_Android_Project.zip -d android-build
          test -f android-build/BlackHoleWallpaper_Android_Project/settings.gradle
          test -f android-build/BlackHoleWallpaper_Android_Project/app/build.gradle
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/android-build/BlackHoleWallpaper_Android_Project" >> "$GITHUB_ENV"

      - name: Safety and architecture checks
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'android.service.wallpaper.WallpaperService' "$MANIFEST"
          grep -q 'android.permission.BIND_WALLPAPER' "$MANIFEST"
          grep -q '0x00030000' "$MANIFEST"
          if grep -R -n -E 'SYSTEM_ALERT_WINDOW|MANAGE_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE|android.permission.INTERNET|File\.delete|Files\.delete|Recycle|Trash' "$PROJECT_DIR/app/src"; then
            echo "Forbidden permission or file-operation code was found."
            exit 1
          fi
          grep -q 'onVisibilityChanged' "$PROJECT_DIR/app/src/main/java/com/maguanyi/blackholewallpaper/BlackHoleWallpaperService.java"
          grep -q 'OpenGL ES 3' "$PROJECT_DIR/README.md"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Show tool versions
        shell: bash
        run: |
          java -version
          gradle --version
          sdkmanager --version

      - name: Run Android lint
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" :app:lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK manifest and package
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.maguanyi.blackholewallpaper'" apk-badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > apk-manifest.txt
          grep -q 'BlackHoleWallpaperService' apk-manifest.txt
          if grep -q -E 'SYSTEM_ALERT_WINDOW|MANAGE_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE|android.permission.INTERNET' apk-manifest.txt; then
            echo "The built APK contains a forbidden permission."
            exit 1
          fi

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" dist/BlackHoleWallpaper-Android-debug.apk
          sha256sum dist/BlackHoleWallpaper-Android-debug.apk > dist/BlackHoleWallpaper-Android-debug.apk.sha256
          cat > dist/安装说明.txt <<'TXT'
          1. 将 BlackHoleWallpaper-Android-debug.apk 传到安卓手机并安装。
          2. 如系统提示来源未知，请仅为当前文件管理器临时允许安装。
          3. 打开“黑洞动态壁纸”，选择背景图、预设、大小、Spin 和帧率。
          4. 点击“预览并设为动态壁纸”，在系统页面确认。
          5. 本测试版没有网络、悬浮窗、文件读取管理、文件删除或回收站权限。
          TXT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackHoleWallpaper-Android-Debug-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30
