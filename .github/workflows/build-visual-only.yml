              "assets/black-hole-trash.ico",
              project / "assets/black-hole-trash.ico",
          )
          if pathlib.Path("LICENSE").exists():
              shutil.copy2("LICENSE", project / "LICENSE")

      - name: Verify safe desktop-only architecture
        shell: python
        run: |
          from pathlib import Path
          import tomllib

          project = Path("desktop-edition")
          manifest_text = (project / "Cargo.toml").read_text(encoding="utf-8")
          source = (project / "src/main.rs").read_text(encoding="utf-8")
          tomllib.loads(manifest_text)

          forbidden_manifest = [
              "windows-capture",
              "Win32_System_Ole",
              "Win32_UI_Shell",
              "Win32_System_DataExchange",
          ]
          forbidden_source = [
              "Windows.Graphics.Capture",
              "FOFX_RECYCLEONDELETE",
              "RegisterDragDrop",
              "IFileOperation",
              "DeleteItem(",
              "WindowLevel::AlwaysOnTop",
          ]
          for value in forbidden_manifest:
              if value in manifest_text:
                  raise SystemExit(f"Forbidden dependency/API feature: {value}")
          for value in forbidden_source:
              if value in source:
                  raise SystemExit(f"Forbidden source symbol: {value}")

          required = [
              "find_desktop_worker",
              "desktop_is_foreground",
              "get_parent_hwnd(hwnd) == worker",
              "load_wallpaper_rgba",
              "parse_config",
              "idle_seconds",
              "monitor_selection",
              "Cursor gravity (desktop only)",
          ]
          for value in required:
              if value not in source:
                  raise SystemExit(f"Required feature missing: {value}")

      - name: Rust formatting and parser validation
        shell: pwsh
        run: |
          cargo fmt --manifest-path desktop-edition/Cargo.toml --all
          cargo fmt --manifest-path desktop-edition/Cargo.toml --all -- --check

      - name: Unit tests
        run: cargo test --manifest-path desktop-edition/Cargo.toml --bin BlackHoleDesktopToy

      - name: Release type check
        run: cargo check --manifest-path desktop-edition/Cargo.toml --release --bin BlackHoleDesktopToy

      - name: Build release EXE
        run: cargo build --manifest-path desktop-edition/Cargo.toml --release --bin BlackHoleDesktopToy

      - name: Verify resolved dependencies and executable
        shell: pwsh
        run: |
          $tree = cargo tree --manifest-path desktop-edition/Cargo.toml
          $tree | Set-Content desktop-edition/dependencies.txt
          $joined = $tree -join "`n"
          if ($joined.Contains('windows-capture')) {
            throw 'windows-capture unexpectedly entered dependency tree'
          }
          $exe = Get-Item desktop-edition/target/release/BlackHoleDesktopToy.exe
          if ($exe.Length -lt 100000) {
            throw 'Built executable is unexpectedly small'
          }

      - name: Package validated build
        shell: python
        run: |
          import hashlib
          import pathlib
          import shutil
          import zipfile

          project = pathlib.Path("desktop-edition")
          dist = pathlib.Path("dist")
          dist.mkdir(exist_ok=True)

          built = project / "target/release/BlackHoleDesktopToy.exe"
          exe = dist / "BlackHoleTrash-DesktopEdition.exe"
          shutil.copy2(built, exe)

          config = """# Black Hole Trash Desktop Edition settings.
          # Remove the leading # to activate a setting. Changes apply automatically.
          #preset = gargantua
          #size = 0.014
          #drift_speed = 1.0
          #drift_x = 0.20
          #drift_y = 0.14
          #fps = 30
          #idle_minutes = 0
          #spin = 0
          #gravity = 1
          #monitor = 0
          #pin_x = 0.5
          #pin_y = 0.5
          """
          (dist / "black-hole-desktop-toy.toml").write_text(
              "\n".join(line.strip() for line in config.splitlines()) + "\n",
              encoding="utf-8",
          )

          readme = """Black Hole Trash - Desktop Edition

          This edition keeps the original black-hole visual experience while using
          the desktop-layer architecture already verified on your Windows system.

          Included:
          - Original black-hole shader and eight visual presets
          - Size, drift speed, FPS, spin and position controls
          - Cursor gravity and cursor absorption animation
          - Screensaver modes: Off / 1 / 5 / 10 minutes
          - All-monitor or single-monitor roaming
          - Hot-reload configuration file
          - Automatic wallpaper refresh and manual Reload wallpaper command

          Safety and compatibility:
          - No live screen capture, so recursive feedback cannot occur
          - No file drag/drop, deletion or Recycle Bin operation
          - Runs in the Windows desktop layer; ordinary applications cover it
          - If desktop parenting fails, it hides whenever another app is foreground

          Controls:
          - Right-click the tray icon for all options
          - Hold Ctrl+Shift while the desktop is active to place and pin the hole
          - Open config file from the tray for precise values

          Run BlackHoleTrash-DesktopEdition.exe. Close older BlackHoleTrash or
          BlackHoleDesktopToy processes first.
          """
          (dist / "README.txt").write_text(
              "\n".join(line.strip() for line in readme.splitlines()) + "\n",
              encoding="utf-8",
          )

          digest = hashlib.sha256(exe.read_bytes()).hexdigest()
          (dist / "BlackHoleTrash-DesktopEdition.exe.sha256").write_text(
              f"{digest}  BlackHoleTrash-DesktopEdition.exe\n",
              encoding="utf-8",
          )

          source_zip = dist / "BlackHoleTrash-DesktopEdition-Source.zip"
          source_files = [
              project / "Cargo.toml",
              project / "Cargo.lock",
              project / "build.rs",
              project / "src/main.rs",
              project / "src/black_hole_trash.wgsl",
              project / "src/cursor_gravity.rs",
              project / "dependencies.txt",
              project / "LICENSE",
          ]
          with zipfile.ZipFile(source_zip, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in source_files:
                  if path.exists():
                      archive.write(path, path.relative_to(project))

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackHoleTrash-DesktopEdition-Windows-x64
          path: dist/*
          if-no-files-found: error
