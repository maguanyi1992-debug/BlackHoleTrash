              path = root / relative
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode("".join(encoded.split())))

          shutil.copy2("src/black_hole_trash.wgsl", root / "src/black_hole_trash.wgsl")
          shutil.copy2(
              "src/platform/windows/cursor_gravity.rs",
