name: Build visual-only Windows executables

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build standard version
        shell: pwsh
        run: |
          cargo build --release --locked
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/BlackHoleTrash.exe dist/BlackHoleTrash-VisualOnly.exe

      - name: Build CPU compatibility version
        shell: pwsh
        run: |
          cargo build --release --locked --features cpu-compat
          Copy-Item target/release/BlackHoleTrash.exe dist/BlackHoleTrash-VisualOnly-CPU-Compat.exe

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: BlackHoleTrash-VisualOnly-Windows-x64
          path: dist/*
          if-no-files-found: error
