          if pathlib.Path("LICENSE").exists():
              shutil.copy2("LICENSE", root / "LICENSE")

      - name: Verify desktop-only architecture
        shell: pwsh
        run: |
          $manifest = Get-Content desktop-toy/Cargo.toml -Raw
          $source = Get-Content desktop-toy/src/main.rs -Raw

          $forbiddenManifest = @(
            'windows-capture',
            'Win32_System_Ole',
            'Win32_UI_Shell',
            'Win32_System_DataExchange'
          )
          foreach ($item in $forbiddenManifest) {
            if ($manifest.Contains($item)) {
              throw "Forbidden dependency or API feature found: $item"
            }
          }

          $forbiddenSource = @(
            'Windows.Graphics.Capture',
            'FOFX_RECYCLEONDELETE',
            'RegisterDragDrop',
            'IFileOperation',
            'DeleteItem(',
            'WindowLevel::AlwaysOnTop'
          )
          foreach ($item in $forbiddenSource) {
            if ($source.Contains($item)) {
              throw "Forbidden source symbol found: $item"
            }
          }

          $requiredSource = @(
            'find_desktop_worker',
            'desktop_is_foreground',
            'get_parent_hwnd(hwnd) == worker',
            'load_wallpaper_rgba'
          )
          foreach ($item in $requiredSource) {
            if (-not $source.Contains($item)) {
              throw "Required desktop-only protection is missing: $item"
            }
          }

      - name: Rust syntax and formatting validation
        shell: pwsh
        run: |
          cargo fmt --manifest-path desktop-toy/Cargo.toml --all
          cargo fmt --manifest-path desktop-toy/Cargo.toml --all -- --check

      - name: Unit tests
        run: cargo test --manifest-path desktop-toy/Cargo.toml --bin BlackHoleDesktopToy

      - name: Release type check
        run: cargo check --manifest-path desktop-toy/Cargo.toml --release --bin BlackHoleDesktopToy

      - name: Build release EXE
        run: cargo build --manifest-path desktop-toy/Cargo.toml --release --bin BlackHoleDesktopToy

      - name: Verify resolved dependencies
        shell: pwsh
        run: |
          $tree = cargo tree --manifest-path desktop-toy/Cargo.toml
          $tree | Set-Content desktop-toy/dependencies.txt
          if (($tree -join "`n").Contains('windows-capture')) {
            throw 'windows-capture unexpectedly entered the resolved dependency tree'
          }

      - name: Package validated build
        shell: python
        run: |
          import hashlib
          import pathlib
          import shutil
          import zipfile

          project = pathlib.Path("desktop-toy")
          dist = pathlib.Path("dist")
          dist.mkdir(exist_ok=True)

          exe = project / "target/release/BlackHoleDesktopToy.exe"
          output = dist / "BlackHoleDesktopToy.exe"
          if not exe.exists() or exe.stat().st_size < 100_000:
              raise SystemExit("Validated EXE was not produced or is unexpectedly small")
          shutil.copy2(exe, output)

          readme_lines = [
              "Black Hole Desktop Toy",
              "",
              "Desktop-only edition based on the original BlackHoleTrash visual shader.",
              "",
              "- Runs in the Windows desktop layer; normal applications cover it.",
              "- If desktop-layer attachment fails, it hides while another app is foreground.",
              "- Uses a static copy of the current wallpaper, not live screen capture.",
              "- No recursive capture feedback, file drag/drop, or Recycle Bin operation.",
              "- Cursor gravity is active only while the desktop is foreground.",
              "- Hold Ctrl+Shift on the desktop to place and pin the black hole.",
              "- Right-click the tray icon for presets, size, speed, FPS, spin and quit.",
              "- Default is 30 FPS with Spin disabled.",
              "",
              "If Windows SmartScreen appears, choose More info, then Run anyway.",
          ]
          (dist / "README.txt").write_text(
              "\n".join(readme_lines) + "\n",
              encoding="utf-8",
          )

          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          (dist / "BlackHoleDesktopToy.exe.sha256").write_text(
              f"{digest}  BlackHoleDesktopToy.exe\n",
              encoding="utf-8",
          )

          source_zip = dist / "BlackHoleDesktopToy-Source.zip"
          source_files = [
              project / "Cargo.toml",
              project / "Cargo.lock",
              project / "build.rs",
              project / "src/main.rs",
              project / "src/black_hole_trash.wgsl",
              project / "src/cursor_gravity.rs",
              project / "dependencies.txt",
              project / "LICENSE",
          ]
          with zipfile.ZipFile(source_zip, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in source_files:
                  if path.exists():
                      archive.write(path, path.relative_to(project))

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackHoleDesktopToy-Windows-x64
          path: dist/*
          if-no-files-found: error
