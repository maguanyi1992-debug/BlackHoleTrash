name: Build visual-only anti-feedback Windows executables

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Apply anti-feedback source fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/main.rs")
          text = path.read_text(encoding="utf-8")

          old_startup = """            #[cfg(any(windows, target_os = "macos"))]
                      capture::start(shared.clone(), mon_index);

                      // overlay styles only after the swapchain exists (layered-window
                      // rule); the window is still hidden at this point
                      let _ = window.set_cursor_hittest(false);
                      #[cfg(any(windows, target_os = "macos"))]
                      set_capture_exclusion(&window, true);
          """

          new_startup = """            // Apply capture exclusion before the capture session starts.
                      let _ = window.set_cursor_hittest(false);
                      #[cfg(any(windows, target_os = "macos"))]
                      {
                          set_capture_exclusion(&window, true);
                          std::thread::sleep(std::time::Duration::from_millis(150));
                      }

                      #[cfg(any(windows, target_os = "macos"))]
                      capture::start(shared.clone(), mon_index);
          """

          if old_startup not in text:
              raise SystemExit("Startup patch target not found in src/main.rs")
          text = text.replace(old_startup, new_startup, 1)

          old_show = """                    pane.window.set_window_level(WindowLevel::AlwaysOnTop);
                              pane.visible = true;
          """

          new_show = """                    pane.window.set_window_level(WindowLevel::AlwaysOnTop);
                              #[cfg(any(windows, target_os = "macos"))]
                              set_capture_exclusion(&pane.window, true);
                              pane.visible = true;
          """

          if old_show not in text:
              raise SystemExit("Visibility patch target not found in src/main.rs")
          text = text.replace(old_show, new_show, 1)

          path.write_text(text, encoding="utf-8", newline="\n")

      - name: Build standard anti-feedback version
        shell: pwsh
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/BlackHoleTrash.exe dist/BlackHoleTrash-VisualOnly-AntiFeedback.exe

      - name: Build CPU anti-feedback version
        shell: pwsh
        run: |
          cargo build --release --features cpu-compat
          Copy-Item target/release/BlackHoleTrash.exe dist/BlackHoleTrash-VisualOnly-CPU-AntiFeedback.exe

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          Get-FileHash dist/BlackHoleTrash-VisualOnly-AntiFeedback.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  BlackHoleTrash-VisualOnly-AntiFeedback.exe" } |
            Set-Content dist/BlackHoleTrash-VisualOnly-AntiFeedback.exe.sha256
          Get-FileHash dist/BlackHoleTrash-VisualOnly-CPU-AntiFeedback.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  BlackHoleTrash-VisualOnly-CPU-AntiFeedback.exe" } |
            Set-Content dist/BlackHoleTrash-VisualOnly-CPU-AntiFeedback.exe.sha256

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: BlackHoleTrash-VisualOnly-AntiFeedback-Windows-x64
          path: dist/*
          if-no-files-found: error
